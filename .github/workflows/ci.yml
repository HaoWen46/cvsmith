name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TYPST_VERSION: "0.15.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Typst and Poppler
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Validate public distribution
        run: uv run --locked pytest evals/test_public_distribution.py -q
      - name: Test
        run: uv run --locked pytest evals/ -q
      - name: Package
        run: uv run --locked scripts/package_release.py -o /tmp/cvsmith-skills

  package-portability:
    name: Package portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test packaging contract
        run: uv run --locked pytest evals/test_packaging.py -q
