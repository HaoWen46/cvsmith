# Synthetic fixture — "Sam Casey" does not exist. Regression case for
# the density-dependent reading-order bug (external review finding 3):
# a sparse but perfectly normal CV — one ordinary job, one project, no
# summary/publications/awards — used to have its Experience/Education
# date ranges reordered after SKILLS by poppler's default (non -layout)
# text extraction, purely because there wasn't enough other content on
# the page to keep the right-aligned date column from reading as an
# independent column. Padding the same structure with more content used
# to make it pass; it must pass exactly as-is. See evals/test_sparse_density.py.

